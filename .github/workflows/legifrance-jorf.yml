name: Veille sécurité privée — Journal officiel (Légifrance → RSS)

on:
  schedule:
    # Le JO paraît le matin. GitHub retarde librement les workflows planifiés
    # (constaté : 06:17 UTC exécuté vers 11:10 UTC deux jours de suite), d'où
    # plusieurs créneaux : le premier qui part publie, les suivants ne coûtent
    # qu'une republication du flux avec une date fraîche.
    - cron: "17 4 * * *" # 04:17 UTC
    - cron: "17 6 * * *" # 06:17 UTC
    - cron: "17 8 * * *" # 08:17 UTC
    - cron: "17 10 * * *" # 10:17 UTC
  workflow_dispatch:

permissions:
  contents: write # commit du cache et du flux
  pages: write # déploiement GitHub Pages
  id-token: write # requis par actions/deploy-pages

concurrency:
  group: legifrance-jorf
  cancel-in-progress: false

jobs:
  legifrance-jorf:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Scrape Légifrance, résumés Gemini, génération du flux
        env:
          LEGIFRANCE_CLIENT_ID: ${{ secrets.LEGIFRANCE_CLIENT_ID }}
          LEGIFRANCE_CLIENT_SECRET: ${{ secrets.LEGIFRANCE_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/legifrance-jorf.feed.xml
        run: deno run --allow-net --allow-env --allow-read --allow-write legifrance-jorf.ts

      - name: Commit du cache et du flux si un texte a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legifrance-jorf.cache.json legifrance-jorf.ignored.json legifrance-jorf.feed.xml
          # Le flux change à chaque passage (lastBuildDate) : seul le cache
          # décide d'un commit, sinon l'historique se remplirait de bruit.
          if git diff --cached --quiet -- legifrance-jorf.cache.json legifrance-jorf.ignored.json; then
            echo "Aucun nouveau texte : flux republié avec sa nouvelle date, sans commit."
            git reset -q
          else
            git commit -m "chore(legifrance-jorf): mise à jour du flux $(date -u +%Y-%m-%d)"
            git push
          fi

      # Déploiement Pages à chaque passage : même sans nouveau texte, le flux
      # publié porte la date du dernier passage (lastBuildDate), ce que lisent
      # le serveur SEKLYR et le site vitrine comme signal de fraîcheur.
      - name: Assemblage du site
        run: cp *.feed.xml site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deploy
